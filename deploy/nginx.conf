# Configuración de nginx para Omega Complex
# Dominio: omegacomplex.coderhivex.com
#
# ESTE ARCHIVO EMPIEZA SOLO CON HTTP, A PROPÓSITO.
#
# ¿Por qué? Porque el certificado de https lo crea certbot, y certbot
# necesita que nginx ya esté funcionando para poder pedirlo. Si este archivo
# pidiera el certificado desde el principio, nginx no arrancaría nunca
# (buscaría un archivo de certificado que todavía no existe) y certbot no
# podría hacer su trabajo.
#
# El orden correcto es:
#   1. Este archivo (solo HTTP)  -> nginx arranca
#   2. certbot --nginx           -> pide el certificado y él mismo añade
#                                   las líneas de https y la redirección
#
# Por eso aquí NO hay ssl_certificate: lo agrega certbot.

server {
    listen 80;
    listen [::]:80;
    server_name omegacomplex.coderhivex.com www.omegacomplex.coderhivex.com;

    # Certbot deja aquí los archivos con los que valida que el dominio es tuyo.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Todo lo demás va a la app de Docker.
    location / {
        proxy_pass http://127.0.0.1:PUERTO_OMEGA;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Las fotos 360 y los PDFs son pesados, y la base de datos está lejos:
        # sin subir estos tiempos nginx cortaría la conexión a los 60 segundos.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Cuerpos grandes (subidas, PDFs).
        client_max_body_size 20m;
    }
}
