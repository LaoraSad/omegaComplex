# Configuración de nginx para Omega Complex
# Dominio: omegacomplex.coderhivex.com
#
# nginx es el "portero" del servidor: recibe las peticiones de internet por el
# puerto 443 (HTTPS), le pasa todo a la app de Docker que escucha en 3000, y
# devuelve la respuesta. La app nunca queda expuesta directamente.
#
# Para usarlo, en el VPS copia este archivo a /etc/nginx/sites-available/ y
# luego ejecuta los 3 comandos del final de la guía.

server {
    # HTTP puro: aquí solo se REDIRIGE a HTTPS, no se sirve nada.
    listen 80;
    listen [::]:80;
    server_name omegacomplex.coderhivex.com www.omegacomplex.coderhivex.com;

    location /.well-known/acme-challenge/ {
        # Certbot deja aquí los archivos que necesita para validar el dominio.
        root /var/www/html;
    }

    location / {
        return 301 https://omegacomplex.coderhivex.com$request_uri;
    }
}

server {
    # HTTPS: aquí ya se sirve la aplicación.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name omegacomplex.coderhivex.com www.omegacomplex.coderhivex.com;

    # Los certificados los genera y renueva certbot en /etc/letsencrypt.
    ssl_certificate     /etc/letsencrypt/live/omegacomplex.coderhivex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omegacomplex.coderhivex.com/privkey.pem;

    # Cabeceras de seguridad. HSTS obliga al navegador a no volver a pedir
    # el sitio por HTTP nunca más.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Las fotos 360 y los PDFs son pesados: sin esto nginx los cortaría.
    client_max_body_size 20m;

    # ---- Todo va a la app de Docker ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # El visor 360 y el panel hacen consultas que pueden tardar (por eso
        # la base está lejos). Sin esto nginx se cortaría a los 60 segundos.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
