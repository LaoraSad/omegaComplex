# Omega Complex — despliegue con un solo comando: `docker compose up -d --build`
#
# El servicio `migrate` aplica las migraciones y el seed ANTES de que arranque
# la app. Si eso falla, `web` no arranca: es preferible que el contenedor caiga
# y lo notes a que levante una app contra una base sin tablas.
#
# `migrate` se construye sobre la etapa `migrator` del Dockerfile porque la
# imagen final de Next (standalone) no incluye el CLI de Prisma. Ojo: NO usar
# `builder` aqui, que corre `next build` y duplicaria el build en el VPS.

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    image: omega-complex:latest
    # Nombre fijo: el instalador y los comandos de la guía lo buscan por aquí.
    container_name: omega-web
    restart: unless-stopped
    depends_on:
      migrate:
        # Si el seed falla, la web ni se intenta arrancar.
        condition: service_completed_successfully
    ports:
      # Puerto en el servidor. Por defecto 3000; si esa máquina ya la usa otra
      # persona, el instalador elige otro y lo deja anotado en el .env.
      - "${PUERTO_APP:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    # 127.0.0.1 y no "localhost": dentro del contenedor localhost resuelve a
    # ::1 (IPv6) y el server de Next solo escucha en IPv4, así que con
    # localhost el healthcheck falla aunque la app esté perfecta.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Si algún día quieres Postgres en el mismo VPS, descomenta esto y quita el
  # DATABASE_URL del .env apuntando a "db" en vez de Supabase.
