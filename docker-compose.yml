services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: omega-complex:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    # Healthcheck real: Next responde 200 en / cuando está sano.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # En producción la BD suele estar afuera (Supabase). Si algún día se quiere
    # levantar Postgres en el mismo compose, descomentar el servicio y el depends_on.
