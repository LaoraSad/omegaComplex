name: omega-github CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # ========================================================
  # FASE 1: CI (Validación previa en GitHub)
  # ========================================================
  omega-ci-validate:
    name:  omega-github CI Validation
    runs-on: ubuntu-latest

    env:
      # Prisma requiere una URL dummy durante el build para validar el esquema
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name:  Clonar repositorio
        uses: actions/checkout@v4

      - name:  Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name:  Instalar dependencias
        run: npm ci

      - name:  Generar cliente Prisma
        run: npx prisma generate

      - name:  TypeScript Check
        run: npm run typecheck

      - name:  Linting
        run: npm run lint

      - name:  Probar compilación
        run: npm run build

  # ========================================================
  # FASE 2: CD (Conexión SSH y Despliegue en la VPS)
  # ========================================================
  omega-cd-deploy:
    name:  omega-github Despliegue VPS
    needs: omega-ci-validate
    runs-on: ubuntu-latest

    steps:
      - name:  Ejecutar despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "Conectado a la VPS. Iniciando despliegue..."
            
            # Cambiar a la carpeta del proyecto
            cd ${{ secrets.VPS_PROJECT_PATH }}
            
            # Traer los cambios de GitHub
            git fetch origin main
            git reset --hard origin/main
            
            # Instalar dependencias y actualizar base de datos
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            
            # Compilar para producción
            npm run build
            
            # Recargar el proceso en PM2 sin caída del servicio
            pm2 reload ${{ secrets.VPS_PM2_NAME }} --update-env
            
            echo "Despliegue completado con éxito."
